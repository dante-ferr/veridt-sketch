name: veridit

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: veridit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veridit_local}
      POSTGRES_DB: veridit
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD:-identity_local}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD:-notification_local}
      CAPTURE_DB_PASSWORD: ${CAPTURE_DB_PASSWORD:-capture_local}
      RECORDS_DB_PASSWORD: ${RECORDS_DB_PASSWORD:-records_local}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments_local}
      TZ: America/Sao_Paulo
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infra/postgres/init-schemas.sh:/docker-entrypoint-initdb.d/01-schemas.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U veridit -d veridit"]
      interval: 2s
      timeout: 5s
      retries: 30

  rabbitmq:
    image: rabbitmq:3.13-alpine
    environment:
      RABBITMQ_DEFAULT_USER: veridit
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-veridit_local}
      TZ: America/Sao_Paulo
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 3s
      timeout: 5s
      retries: 30

  mailpit:
    image: axllent/mailpit:v1.21
    ports:
      - "8025:8025"
    environment:
      TZ: America/Sao_Paulo

  identity:
    build:
      context: .
      dockerfile: services/identity/Dockerfile
    environment:
      DATABASE_URL: postgresql://identity:${IDENTITY_DB_PASSWORD:-identity_local}@postgres:5432/veridit?schema=identity
      RABBIT_URL: amqp://veridit:${RABBITMQ_PASSWORD:-veridit_local}@rabbitmq:5672
      JWT_ISSUER: veridit-identity
      JWT_AUDIENCE: veridit
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-identity_service_local}
      TZ: America/Sao_Paulo
    volumes:
      - identity-secrets:/var/lib/veridit
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  notification:
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      DATABASE_URL: postgresql://notification:${NOTIFICATION_DB_PASSWORD:-notification_local}@postgres:5432/veridit?schema=notification
      RABBIT_URL: amqp://veridit:${RABBITMQ_PASSWORD:-veridit_local}@rabbitmq:5672
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
      SMTP_FROM: Veridit <no-reply@localhost>
      PUBLIC_WEB_ORIGIN: https://localhost:8443
      JWKS_URL: http://identity:3000/v1/keys/jwks
      JWT_ISSUER: veridit-identity
      JWT_AUDIENCE: veridit
      TZ: America/Sao_Paulo
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  schema-init:
    image: postgres:16
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-veridit_local}
      POSTGRES_USER: veridit
      POSTGRES_DB: veridit
      CAPTURE_DB_PASSWORD: ${CAPTURE_DB_PASSWORD:-capture_local}
      RECORDS_DB_PASSWORD: ${RECORDS_DB_PASSWORD:-records_local}
      PAYMENTS_DB_PASSWORD: ${PAYMENTS_DB_PASSWORD:-payments_local}
    volumes:
      - ./infra/postgres/ensure-schemas.sh:/ensure-schemas.sh:ro
    entrypoint: ["/bin/sh", "/ensure-schemas.sh"]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  minio:
    image: docker.io/bitnamilegacy/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veridit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veridit_local_minio}
    ports:
      - "9000:9000"
    volumes:
      - minio-data:/bitnami/minio/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/minio/health/live"]
      interval: 3s
      timeout: 5s
      retries: 40
      start_period: 15s

  minio-init:
    image: docker.io/bitnamilegacy/minio-client:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-veridit}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-veridit_local_minio}
      WORKER_S3_SECRET_KEY: ${WORKER_S3_SECRET_KEY:-worker_local_secret}
      CAPTURE_S3_SECRET_KEY: ${CAPTURE_S3_SECRET_KEY:-capture_local_secret}
      RECORDS_S3_SECRET_KEY: ${RECORDS_S3_SECRET_KEY:-records_local_secret}
    volumes:
      - ./infra/minio/init.sh:/init.sh:ro
      - ./infra/minio/worker-policy.json:/policies/worker-policy.json:ro
      - ./infra/minio/capture-policy.json:/policies/capture-policy.json:ro
      - ./infra/minio/records-policy.json:/policies/records-policy.json:ro
    entrypoint: ["/bin/sh", "/init.sh"]
    depends_on:
      minio:
        condition: service_healthy
    restart: "no"

  payments:
    build:
      context: .
      dockerfile: services/payments/Dockerfile
    environment:
      DATABASE_URL: postgresql://payments:${PAYMENTS_DB_PASSWORD:-payments_local}@postgres:5432/veridit?schema=payments
      RABBIT_URL: amqp://veridit:${RABBITMQ_PASSWORD:-veridit_local}@rabbitmq:5672
      JWKS_URL: http://identity:3000/v1/keys/jwks
      JWT_ISSUER: veridit-identity
      JWT_AUDIENCE: veridit
      PAYMENTS_SERVICE_TOKEN: ${PAYMENTS_SERVICE_TOKEN:-payments_service_local}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:-webhook_local_secret}
      PAYMENT_PROVIDER: ${PAYMENT_PROVIDER:-fake}
      MERCADOPAGO_ACCESS_TOKEN: ${MERCADOPAGO_ACCESS_TOKEN:-}
      PUBLIC_WEB_ORIGIN: https://localhost:8443
      PAYMENT_RECONCILE_INTERVAL_MS: "60000"
      PAYMENT_RECONCILE_MIN_AGE_MS: "15000"
      TZ: America/Sao_Paulo
    depends_on:
      schema-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  capture:
    build:
      context: .
      dockerfile: services/capture/Dockerfile
    environment:
      DATABASE_URL: postgresql://capture:${CAPTURE_DB_PASSWORD:-capture_local}@postgres:5432/veridit?schema=capture
      RABBIT_URL: amqp://veridit:${RABBITMQ_PASSWORD:-veridit_local}@rabbitmq:5672
      JWKS_URL: http://identity:3000/v1/keys/jwks
      JWT_ISSUER: veridit-identity
      JWT_AUDIENCE: veridit
      IDENTITY_URL: http://identity:3000
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-identity_service_local}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: capture
      S3_SECRET_KEY: ${CAPTURE_S3_SECRET_KEY:-capture_local_secret}
      S3_BUCKET: evidence
      WORKER_URL: http://capture-worker:3010
      CAPTURE_INTERNAL_TOKEN: ${CAPTURE_INTERNAL_TOKEN:-capture_internal_local}
      PAYMENTS_URL: http://payments:3000
      PAYMENTS_SERVICE_TOKEN: ${PAYMENTS_SERVICE_TOKEN:-payments_service_local}
      TZ: America/Sao_Paulo
    volumes:
      - capture-secrets:/var/lib/veridit
    depends_on:
      schema-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
      payments:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  capture-worker:
    build:
      context: .
      dockerfile: services/capture-worker/Dockerfile
    environment:
      RABBIT_URL: amqp://veridit:${RABBITMQ_PASSWORD:-veridit_local}@rabbitmq:5672
      CAPTURE_URL: http://capture:3000
      CAPTURE_INTERNAL_TOKEN: ${CAPTURE_INTERNAL_TOKEN:-capture_internal_local}
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: worker
      S3_SECRET_KEY: ${WORKER_S3_SECRET_KEY:-worker_local_secret}
      S3_BUCKET: evidence
      NTP_HOST: pool.ntp.org
      PORT: "3010"
      TZ: America/Sao_Paulo
    depends_on:
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      capture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3010/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  records:
    build:
      context: .
      dockerfile: services/records/Dockerfile
    environment:
      DATABASE_URL: postgresql://records:${RECORDS_DB_PASSWORD:-records_local}@postgres:5432/veridit?schema=records
      RABBIT_URL: amqp://veridit:${RABBITMQ_PASSWORD:-veridit_local}@rabbitmq:5672
      JWKS_URL: http://identity:3000/v1/keys/jwks
      JWT_ISSUER: veridit-identity
      JWT_AUDIENCE: veridit
      IDENTITY_URL: http://identity:3000
      IDENTITY_SERVICE_TOKEN: ${IDENTITY_SERVICE_TOKEN:-identity_service_local}
      CAPTURE_URL: http://capture:3000
      S3_ENDPOINT: http://minio:9000
      S3_PUBLIC_ENDPOINT: http://localhost:9000
      S3_ACCESS_KEY: records
      S3_SECRET_KEY: ${RECORDS_S3_SECRET_KEY:-records_local_secret}
      EVIDENCE_BUCKET: evidence
      ARTIFACT_BUCKET: artifacts
      TZ: America/Sao_Paulo
    depends_on:
      schema-init:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
      identity:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
      capture:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 40

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    environment:
      IDENTITY_URL: http://identity:3000
      CAPTURE_URL: http://capture:3000
      RECORDS_URL: http://records:3000
      PAYMENTS_URL: http://payments:3000
      CAPTURE_WORKER_URL: http://capture-worker:3010
      JWKS_URL: http://identity:3000/v1/keys/jwks
      JWT_ISSUER: veridit-identity
      JWT_AUDIENCE: veridit
      PORT: "8080"
      TZ: America/Sao_Paulo
    depends_on:
      identity:
        condition: service_healthy
      capture:
        condition: service_healthy
      records:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:8080/v1/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 3s
      timeout: 5s
      retries: 30

  web:
    build:
      context: .
      dockerfile: web/Dockerfile
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://127.0.0.1/"]
      interval: 3s
      timeout: 5s
      retries: 20

  proxy:
    build: ./infra/proxy
    ports:
      - "8443:443"
    volumes:
      - proxy-certs:/certs
    depends_on:
      gateway:
        condition: service_healthy
      web:
        condition: service_healthy

volumes:
  postgres-data:
  identity-secrets:
  capture-secrets:
  minio-data:
  proxy-certs:
